name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Auto-Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install System Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev \
            build-essential ccache
          pip install --upgrade pip
          pip install --upgrade buildozer cython

      - name: Build Android Package
        run: |
          # pexpect auto-accepts interactive prompts inside buildozer
          python -c '
          import pexpect, sys
          child = pexpect.spawn("buildozer android debug", timeout=1800, encoding="utf-8")
          child.logfile = sys.stdout
          while True:
              idx = child.expect([r"Accept\? \(y/N\):", r"\(y/N\)", pexpect.EOF, pexpect.TIMEOUT])
              if idx in [0, 1]:
                  child.sendline("y")
              elif idx == 2:
                  break
              elif idx == 3:
                  print("Timeout waiting for build step")
                  break
          '

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mira-Astra-APK
          path: bin/*.apk
          retention-days: 7
